<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 200" width="220" height="200" role="img" aria-label="collab — a hub where coding agents talk to each other">
  <title>collab</title>
  <defs>
    <linearGradient id="agent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="agentAlt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="hub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- links: every agent talks through the hub, never directly -->
  <g stroke="#64748b" stroke-opacity="0.55" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M110 68 L110 88"/>
    <path d="M78 118 L92 111"/>
    <path d="M142 118 L128 111"/>
  </g>

  <!-- messages in flight -->
  <g>
    <circle cx="110" cy="79" r="3.4" fill="#22d3ee"/>
    <circle cx="85" cy="114.5" r="3.4" fill="#a855f7"/>
    <circle cx="135" cy="114.5" r="3.4" fill="#818cf8"/>
  </g>

  <!-- the hub -->
  <circle cx="110" cy="102" r="30" fill="url(#glow)"/>
  <path d="M110 80 L127 90 L127 110 L110 120 L93 110 L93 90 Z" fill="url(#hub)"/>
  <path d="M110 80 L127 90 L127 110 L110 120 L93 110 L93 90 Z" fill="none" stroke="#0e7490" stroke-opacity="0.45" stroke-width="1.5"/>
  <!-- three streams fanning out of the hub -->
  <g stroke="#083344" stroke-opacity="0.75" stroke-width="2.2" stroke-linecap="round">
    <path d="M103 96 H117"/>
    <path d="M103 102 H117"/>
    <path d="M103 108 H111"/>
  </g>

  <!-- agent A (top) -->
  <g>
    <rect x="84" y="30" width="52" height="38" rx="9" fill="url(#agent)"/>
    <path d="M104 68 L110 76 L116 68 Z" fill="#6366f1"/>
    <g stroke="#eef2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M96 43 L102 49 L96 55"/>
      <path d="M107 55 H120"/>
    </g>
  </g>

  <!-- agent B (bottom left) -->
  <g>
    <rect x="22" y="128" width="52" height="38" rx="9" fill="url(#agentAlt)"/>
    <path d="M56 129 L70 129 L78 117 Z" fill="#a855f7"/>
    <g stroke="#faf5ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M34 141 L40 147 L34 153"/>
      <path d="M45 153 H58"/>
    </g>
  </g>

  <!-- agent C (bottom right) -->
  <g>
    <rect x="146" y="128" width="52" height="38" rx="9" fill="url(#agent)"/>
    <path d="M164 129 L150 129 L142 117 Z" fill="#6366f1"/>
    <g stroke="#eef2ff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <path d="M158 141 L164 147 L158 153"/>
      <path d="M169 153 H182"/>
    </g>
  </g>
</svg>
