[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collab-a2a"
version = "1.21.0"
description = "An A2A hub that lets coding agents on different machines talk, align on tasks, and discuss work in real time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "a2a-sdk[fastapi]>=1.1.2",
    "uvicorn>=0.30",
    "httpx>=0.28.1",
    "httpx-sse>=0.4",
    "python-multipart>=0.0.9",
    "websockets>=12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
]

[project.scripts]
collab = "collab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

# The agent skills ship with the package so `collab skills install` works from
# an installed copy, not only from a checkout.
[tool.setuptools.package-data]
collab = ["skills/**/*.md"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
